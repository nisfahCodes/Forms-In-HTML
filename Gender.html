<!DOCTYPE html>
<html>
    <head>
        <title> Details of users </title>
        </head>
<body>
    <form>
  <fieldset>
    <!-- The field tag is used to group related elements in a form and draws a box around them-->
     <legend> Personal information:</legend>
     <label> Full name:</label>
     <!--placeholder attribute can be used to provide extra information about entry to be made-->
     <input type="text" id="fname" placeholder="Enter Name">
     <br><br>
     <label> Email</label>
     <input type="text" id="email"> <br><br>
     <label> Gender: </label><br>
     <input type="radio" id="gender"
     value="female">Female<br>
     <input type="radio" id="gender" value="male">Male<br>
     <br>
     <label>Birthday</label>
     <input type="date" id="birthday" name="birthday"><br>
     <label>Password:</label>
     <input type="password" name="password"<br><br>
     <label>Description</label>
     <textarea name="description" rows="4" cols="40"></textarea><br><br>
     <input type="submit" value="register">
     <input type="reset" value="reset">
  </fieldset>      
    </form>
    </body>
    </html>
